[pytest]
testpaths = tests
pythonpath = .
markers =
    real_ocr: opt-in integration test running real Tesseract ara+eng OCR on committed non-client fixtures (set RUN_REAL_OCR=1)
    real_oda: opt-in integration test running real ODA File Converter on committed non-client DWG fixtures (set RUN_REAL_ODA=1)
    real_research: opt-in live controlled research test (set RUN_REAL_RESEARCH=1)
